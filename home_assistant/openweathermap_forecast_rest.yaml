# OpenWeatherMap OneCall v3 -> forecast sensors
# Usage: Add the full OneCall URL (including API key, lat, lon, exclude, units)
# to your Home Assistant secrets.yaml as:
# openweathermap_onecall_url: "https://api.openweathermap.org/data/3.0/onecall?lat=...&lon=...&exclude=minutely,alerts&units=metric&appid=YOUR_API_KEY"

sensor:
  - platform: rest
    name: "owm_onecall_daily"
    resource: !secret openweathermap_onecall_url_daily
    method: GET
    timeout: 10
    value_template: "{{ value_json.current.temp if value_json.current is defined else '' }}"
    json_attributes:
      - daily
      - current
      - alerts
    scan_interval: 1800
  - platform: rest
    name: "owm_onecall_hourly"
    resource: !secret openweathermap_onecall_url_hourly
    method: GET
    timeout: 10
    value_template: "{{ value_json.current.temp if value_json.current is defined else '' }}"
    json_attributes:
      - hourly
    scan_interval: 1800

# Template sensors mapping daily[0..3] to sensor.forecast_*
template:
  - sensor:
      - name: "owm_daily_0"
        state: >-
          {% set d = (state_attr('sensor.owm_onecall_daily','daily') or state_attr('sensor.owm_onecall_daily','daily') or []) %}
          {% if d|length > 0 %}{"dt": {{ d[0].dt | int(0) }}, "temp": {"max": {{ d[0].temp.max | default(d[0].temp.day | default(0)) }}, "min": {{ d[0].temp.min | default(0) }}}, "weather": [{"description": {{ d[0].weather[0].description | tojson }}, "icon": {{ d[0].weather[0].icon | tojson }}}]}{% else %}''{% endif %}
