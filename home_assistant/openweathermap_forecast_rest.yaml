# OpenWeatherMap OneCall v3 -> forecast sensors
# Usage: Add the full OneCall URL (including API key, lat, lon, exclude, units)
# to your Home Assistant secrets.yaml as:
# Base OpenWeather OneCall URL (no exclude params). Fill lat/lon and API key.
# Example: "https://api.openweathermap.org/data/3.0/onecall?lat=48.123&lon=11.456&appid=YOUR_API_KEY&units=metric&lang=de&exclude=minutely"
# openweathermap_onecall_url: "https://api.openweathermap.org/data/3.0/onecall?lat=...&lon=...&appid=YOUR_API_KEY&units=metric&lang=de&exclude=minutely"

sensor:
  - platform: rest
    name: "owm_onecall_daily"
    # Provide a dedicated secret URL that includes excludes for daily data.
    # Example secret value (include API key, lat, lon, units):
    # https://api.openweathermap.org/data/3.0/onecall?lat=48.1&lon=11.2&appid=APIKEY&units=metric&lang=de&exclude=minutely,hourly
    resource: !secret openweathermap_onecall_daily_url
    method: GET
    timeout: 10
    value_template: "{{ value_json.current.temp if value_json.current is defined else '' }}"
    json_attributes:
      - daily
      - current
      - alerts
    scan_interval: 1800
  - platform: rest
    name: "owm_onecall_hourly"
    # Provide a dedicated secret URL that includes excludes for hourly data.
    # Example secret value (include API key, lat, lon, units):
    # https://api.openweathermap.org/data/3.0/onecall?lat=48.1&lon=11.2&appid=APIKEY&units=metric&lang=de&exclude=minutely,daily,current,alerts
    resource: !secret openweathermap_onecall_hourly_url
    method: GET
    timeout: 10
    value_template: "{{ value_json.current.temp if value_json.current is defined else '' }}"
    json_attributes:
      - hourly
    scan_interval: 1800

# Template sensors mapping daily[0..3] to sensor.forecast_*
template:
  - sensor:
      - name: "owm_daily_0"
        state: >-
          {% set d = (state_attr('sensor.owm_onecall_daily','daily') or []) %}
          {% if d|length > 0 %}{{ d[0].dt | int(0) }}{% else %}''{% endif %}
        attributes:
          data: >
            {% set d = (state_attr('sensor.owm_onecall_daily','daily') or []) %}
            {% if d|length > 0 %}
            {
              "last_updated": {{ as_timestamp(states.sensor.owm_onecall_daily.last_updated) | int }},
              "sunrise": {{ d[0].sunrise | int(0) }},
              "sunset": {{ d[0].sunset | int(0) }},
              "temp_max": {{ d[0].temp.max | default(d[0].temp.day | default(0)) }},
              "temp_min": {{ d[0].temp.min | default(0) }},
              "temp_day": {{ d[0].temp.day | default(0) }},
              "temp_night": {{ d[0].temp.night | default(0) }},
              "feels_like_day": {{ d[0].feels_like.day | default(0) }},
              "feels_like_night": {{ d[0].feels_like.night | default(0) }},
              "pressure": {{ d[0].pressure | default(0) }},
