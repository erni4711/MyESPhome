# compatibility sensors mapping daily[0..3] to sensor.forecast_*
  - sensor:
      - name: "forecast_0_condition"
        state: >-
          {% set d = state_attr('sensor.owm_onecall_daily','daily') %}
          {% if d and d|length > 0 and d[0].weather and d[0].weather|length > 0 %}
            {{ d[0].weather[0].main }}
          {% else %}
            ''
          {% endif %}

      - name: "forecast_0_temp_hi"
        state: >-
          {% set d = state_attr('sensor.owm_onecall_daily','daily') %}
          {% if d and d|length > 0 and d[0].temp and d[0].temp.max is defined %}
