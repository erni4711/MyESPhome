# OpenWeatherMap OneCall v3 -> forecast sensors
# Usage: Add the full OneCall URL (including API key, lat, lon, exclude, units)
# to your Home Assistant secrets.yaml as:
# openweathermap_onecall_url: "https://api.openweathermap.org/data/3.0/onecall?lat=...&lon=...&exclude=minutely,alerts&units=metric&appid=YOUR_API_KEY"
sensor:
  - platform: rest
    name: "owm_onecall"
    resource: !secret openweathermap_onecall_url
    method: GET
    timeout: 10
    value_template: "{{ value_json.current.temp if value_json.current is defined else '' }}"
    json_attributes:
      - daily
      - hourly
    scan_interval: 1800

# Template sensors mapping daily[0..3] to sensor.forecast_*
template:
  - sensor:
      - name: "forecast_0_condition"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].weather and d[0].weather|length > 0 %}
            {{ d[0].weather[0].main }}
          {% else %}
            ''
          {% endif %}

      - name: "forecast_0_temp_hi"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].temp and d[0].temp.max is defined %}
            {{ (d[0].temp.max)|round(1) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "°C"

      - name: "forecast_0_temp_lo"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].temp and d[0].temp.min is defined %}
            {{ (d[0].temp.min)|round(1) }}
          {% else %}
            ''
          {% endif %}
        unit_of_measurement: "°C"

      - name: "forecast_0_day"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily')|default([]) %}
          {% set ts = (d[0].dt|int(0)) if d|length > 0 and d[0].dt is defined else 0 %}
          {% if ts > 0 %}
            {% set days = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'] %}
            {{ days[ as_datetime(ts).weekday() ] }}
          {% else %}
            ''
          {% endif %}

      - name: "forecast_0_icon"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].weather and d[0].weather|length > 0 and d[0].weather[0].icon is defined %}
            {{ d[0].weather[0].icon }}
          {% else %}
            ''
          {% endif %}

      - name: "forecast_0_description"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].weather and d[0].weather|length > 0 and d[0].weather[0].description is defined %}
            {{ d[0].weather[0].description }}
          {% else %}
            ''
          {% endif %}

      - name: "forecast_0_wind_speed"
        state: >-
          {% set d = state_attr('sensor.owm_onecall','daily') %}
          {% if d and d|length > 0 and d[0].wind_speed is defined %}
