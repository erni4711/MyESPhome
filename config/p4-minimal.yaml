esphome:
  name: p4-minimal
  environment_variables:
    IDF_PATH: C:\esp\v6.1\esp-idf
    IDF_TOOLS_PATH: C:\Espressif\tools
    IDF_PYTHON_ENV_PATH: C:\Espressif\tools\python\v6.1\venv
    ESP_IDF_VERSION: "6.1"
    PYTHONUTF8: "1"
    PATH: C:\Espressif\tools\python\v6.1\venv\Scripts;C:\Espressif\tools\riscv32-esp-elf\esp-15.2.0_20251204\riscv32-esp-elf\bin;C:\Espressif\tools\cmake\4.0.3\bin;C:\Espressif\tools\ninja\1.12.1;C:\Espressif\tools\ccache\4.12.1\ccache-4.12.1-windows-x86_64;C:\esp\v6.1\esp-idf\tools;C:\Program Files\Git\cmd;C:\Windows\System32;C:\Windows

esp32:
  variant: esp32p4
  engineering_sample: false
  flash_size: 32MB
  flash_mode: dio
  flash_frequency: 80MHz
  partitions: partitions-esp32p4-32mb.csv
  cpu_frequency: 400MHz
  framework:
    type: esp-idf
    version: "6.1"
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: hex
  speed: 200MHz

# -------------------------------------------
# Network hardware
# -------------------------------------------
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: ESP-Hosted Firmware
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

http_request:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot with password
  ap:
    ssid: "Secure-Device-Fallback"
    password: "12345678"

# OTA with password (REQUIRED)
ota:
  - platform: esphome
    password: "1234"

logger:
  level: DEBUG
  hardware_uart: UART0
