# History Charts LVGL Page
# 24-hour temperature and humidity line charts
# Requires: history_charts.yaml component to be included first

id: history_page
on_load:
  - lambda: |-
      id(lvgl_page_select).publish_state("History");
  - script.execute: refresh_history_page
widgets:
  - obj:
      align: TOP_MID
      styles: header_footer
      widgets:
        - label:
            text: "Temperature & Humidity - Last 24h"
            align: CENTER
            text_align: CENTER
            text_color: 0xFFFFFF
  - obj:
      align: top_left
      y: ${ui_header_height}
      width: 100%
      height: ${ui_page_height}
      scrollbar_mode: "OFF"
      scrollable: false
      border_width: 0
      shadow_width: 0
      outline_width: 0
      pad_all: 8
      layout:
        type: grid
        grid_rows: [ SIZE_CONTENT, 130, SIZE_CONTENT ]
        grid_columns: [ fr(1), fr(1) ]
        pad_column: 8
        pad_row: 6
      widgets:
        - label:
            grid_cell_row_pos: 0
            grid_cell_column_pos: 0
            text: "Temperature (C)"
            text_font: font_norm
        - obj:
            grid_cell_row_pos: 1
            grid_cell_column_pos: 0
            width: 100%
            height: 130
            bg_opa: TRANSP
            border_width: 1
            border_color: 0x555555
            pad_all: 0
            widgets:
              - line:
                  id: temperature_history_line
                  align: CENTER
                  width: 100%
                  height: 130
                  line_width: 3
                  line_color: 0xFF6B57
                  line_rounded: true
                  points:
                    - x: 0
                      y: !lambda |- 
                        int y = 120 - (int) ((id(temp_history_24h)[0] - 10.0f) * 4.8f);
                        if (y < 0) y = 0;
                        if (y > 120) y = 120;
                        return y;
