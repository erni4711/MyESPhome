
esphome:
  name: $devicename
  name_add_mac_suffix: false

esp32:
  board: esp32cam
  framework:
    type: esp-idf

# Enable logging
logger:
#esp32_ble_tracker:

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Esp32-Cam Fallback Hotspot"
  domain: $domain

#captive_portal:

# Example configuration entry
# mdns:
#   disabled: false
  
i2c:
  id: i2c_cam
  sda: GPIO26
  scl: GPIO27  
  scan: False

esp32_camera:
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_id: i2c_cam
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  
  name: $friendly_name
  
  # image settings
  resolution: 1024X768
  contrast: 1
  brightness: 1
  saturation: 0
  max_framerate: 25 fps
  vertical_flip: false
  ae_level: 1
  agc_gain_ceiling: 16x

# Example configuration entry
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

time:
  - platform: homeassistant
    id: homeassistant_time

output:
#flashlight
  - platform: ledc
    pin: GPIO4
    id: gpio_4
#statuslight led 33 for wifi connect
  - platform: gpio
    pin:
      number: GPIO33
      inverted: True
    id: gpio_33
light:
#flashlight
  - platform: monochromatic
    output: gpio_4
    name: $friendly_name light
#statuslight led 33 for wifi connect
  - platform: binary
    output: gpio_33
    name: $friendly_name wifi light state

sensor:
  - platform: wifi_signal
    name: $friendly_name Wifi signal
    update_interval: 10s
  - platform: uptime
    name: $friendly_name Uptime

text_sensor:
  - platform: version
    name: $friendly_name ESPHome Version
  - platform: wifi_info
    ssid:
      name: $friendly_name WiFi

switch:      
  - platform: restart
    name: $friendly_name restart
