lvgl:
  rotation: ${rotation | default("0")}

  on_swipe_left:
    - lvgl.page.next:
        animation: NONE
        #time: 180ms
  on_swipe_right:
    - lvgl.page.previous:
        animation: NONE
        #time: 180ms
  theme:
    label:
      text_font: font_norm
    button:
      text_font: font_norm
    spinbox:
      text_font: font_norm
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: display_backlight
      - switch.turn_on: switch_antiburn
      - lvgl.pause:
