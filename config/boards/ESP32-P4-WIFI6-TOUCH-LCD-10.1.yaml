      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0xffffff
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          shadow_width: 0
          widgets:
            - label:
                id: boot_about_label              
                align: TOP_LEFT
                text_font: roboto_med
                text: "${mdi_info} About"
                hidden: true
            - image:
                align: CENTER
                src: boot_logo
                y: -40
            - spinner:
                align: CENTER
                y: 95
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8
            - label:
                id: boot_version_label
                align: CENTER
                y: 160  
                text: "X"
            - label:
                id: boot_network_label
                align: CENTER
                y: 195
                text_font: font_small
                text: "Network: connecting"
            - label:
                id: boot_sd_label
                align: CENTER
                y: 220
                text_font: font_small
                text: "SD: checking"
            - label:
                border_width: 4
                border_color: white
                align: BOTTOM_RIGHT
                text_font: font_small
                text: "based on a template by Bernd Oerding\nhttps://github.com/erni4711/MyESPhome.git"
            - label:
                align: CENTER
                y: 250
                text: "Touch to close"
            
          on_press:
            - lvgl.widget.hide: boot_screen

