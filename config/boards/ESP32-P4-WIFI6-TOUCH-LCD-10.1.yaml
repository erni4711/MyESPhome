# WaveShare ESP32 P4 Touch 10.1zoll 
# https://docs.waveshare.com/ESP32-P4-WIFI6-Touch-LCD-X
esphome:
  name: ${node_name}
  min_version: "2026.7.0"
  name_add_mac_suffix: false
  build_flags:
    - -DLV_USE_SNAPSHOT=1
    - -DLV_FONT_FMT_TXT_LARGE=1
    - -DBOARD_HAS_PSRAM=1
    - -DCONFIG_SDMMC_ENABLE_POWER_CONTROL=1
  platformio_options:
    build_flags:
      - -DLV_FONT_FMT_TXT_LARGE=1
      - -DLV_USE_FONT_COMPRESSED=1
    board_build.extra_flags: -DLV_USE_SNAPSHOT=1 -DLV_FONT_FMT_TXT_LARGE=1 -DBOARD_HAS_PSRAM=1 -DCONFIG_SDMMC_ENABLE_POWER_CONTROL=1
    #   board_build.flash_mode: qio
    #   board_build.psram_mode: opi
    #   board_upload.maximum_ram_size: 524288
  on_boot:
    - logger.log: "Boot sequence started"
    - lvgl.widget.show: boot_screen
    - light.turn_on: display_backlight
    - delay: 5s
    - lvgl.widget.hide: boot_screen
## on_boot temporarily disabled for build tracing
# on_boot:
#  priority: -200
#  then:
#    - delay: 2s

external_components:
  - source:
      type: local
      path: components
  # # Explicit local web_admin component (copied into config/components/web_admin)
  # - source:
  #     type: local
  #     path: components/web_admin

substitutions:
  screen_height: ${1280 if rotation | default("0") not in ["90", "270"] else 800}
  screen_width: ${800 if rotation | default("0") not in ["90", "270"] else 1280}

  ui_header_height: 60
  ui_footer_height: 60
  ui_page_height: 520
  ui_page_width: 1280
  ui_half_page_width: 640
  ui_half_page_height: 260
  ui_header_font_size: 30
  ui_title_font_size: 34
  ui_huge_font_size: 50
  ui_norm_font_size: 26
  ui_small_font_size: 20
  ui_weather_symbol_size: 80
  ui_weather_symbol_smallersize: 64
  ui_weather_symbol_smallsize: 40
  ui_weather_hourly_column_width: 78
  ui_climate_width: 325
  ui_climate_height: 260
  ui_climate_col_left: 65
  ui_climate_col_center: 195
  ui_climate_col_right: 65
  ui_climate_row_1: 43
  ui_climate_row_2: 43
  ui_climate_row_3: 43
  ui_climate_row_4: 43
  ui_climate_row_5: 44
  ui_climate_row_6: 44
  ui_climate_button_row_height: 40
  ui_climate_button_col_left_width: 66
  ui_climate_button_col_right_width: 48
  ui_climate_circle_button_size: 48
  ui_climate_circle_button_radius: 12
  ui_climate_menu_button_width: 66
  ui_climate_menu_button_height: 40
  ui_climate_menu_button_radius: 12
  ui_climate_mode_button_width: 46
  ui_climate_mode_button_height: 40
  ui_climate_mode_button_radius: 12
  ui_climate_ring_diameter: 240
  ui_climate_ring_radius: 120
  ui_climate_ring_width: 15
  ui_climate_meter_diameter: 180
  ui_climate_meter_radius: 90
  ui_climate_knob_diameter: 205

esp32:
  board: esp32-p4-evboard
  variant: esp32p4
  flash_size: 32MB
  partitions: partitions-esp32p4-32mb.csv
  cpu_frequency: 360MHz
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: true
      # Required by sd_file_server directory listing (/file UI)
      disable_vfs_support_dir: false
      disable_fatfs: false

    sdkconfig_options:
      CONFIG_FATFS_LFN: y
      CONFIG_FATFS_LFN_HEAP: y
      CONFIG_FATFS_MAX_LFN: "255"
      CONFIG_LV_USE_SNAPSHOT: "y"
      CONFIG_LV_FONT_FMT_TXT_LARGE: "y"
      CONFIG_LV_USE_FONT_COMPRESSED: "y"
      CONFIG_SDMMC_ENABLE_POWER_CONTROL: "y"
      CONFIG_ESP_TASK_WDT_EN: "y"
      # CONFIG_SPIRAM_SUPPORT: "y"
      CONFIG_ESP_INT_WDT: n
      # CONFIG_ESP_INT_WDT_TIMEOUT_MS: "20000"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
      # # ISP / Video pipeline and camera support
      # CONFIG_ESP_VIDEO_ENABLE_ISP_PIPELINE_CONTROLLER: "y"
      # CONFIG_SOC_ISP_SUPPORTED: "y"
      # CONFIG_SOC_ISP_DVP_SUPPORTED: "y"
      # CONFIG_SOC_ISP_DEMOSAIC_SUPPORTED: "y"
      # CONFIG_SOC_ISP_LSC_SUPPORTED: "y"
      # CONFIG_SOC_ISP_WBG_SUPPORTED: "y"
      # CONFIG_SOC_ISP_SHARPEN_SUPPORTED: "y"
      # CONFIG_SOC_ISP_CCM_SUPPORTED: "y"
      # CONFIG_SOC_ISP_BF_SUPPORTED: "y"

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

esp_ldo:
  - voltage: 2.5V
    channel: 3

http_request:

# -------------------------------------------
# Network hardware
# -------------------------------------------
esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

# Firmware update for esp32_hosted ESP32-C6
update:
  - platform: esp32_hosted
    name: ESP-Hosted Firmware
    icon: mdi:chip
    type: http
    source: https://esphome.github.io/esp-hosted-firmware/manifest/esp32c6.json
    update_interval: 6h

# -------------------------------------------
# Touchscreen GT911/GT9271 i2c
# -------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    scan: true



touchscreen:
  - platform: gt911
    id: my_touchscreen
    i2c_id: bus_a
    update_interval: 50ms
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - switch.turn_off: switch_antiburn
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight
     # on_touch:
      #   - logger.log:
      #   format: Touch at (%d, %d)
      #   args: [touch.x, touch.y]
      #   - lambda: |-
      #       ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
      #       touch.x,
      #       touch.y,
      #       touch.x_raw,
      #       touch.y_raw
      #       );

# -------------------------------------------
# Backlight
# -------------------------------------------
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO26
    inverted: false
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# -------------------------------------------
# Display
# -------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-P4-NANO-10.1
    reset_pin:
      number: GPIO27
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 1280


# -------------------------------------------
# Audio devices
# -------------------------------------------
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    # on_data:
    #   - logger.log:
    #       format: "Microphone data received: %d bytes"
    #       args: [x.size()]

speaker:
  - platform: i2s_audio
    id: my_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: my_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: gpio
    id: audio_amplifier
    name: Speaker Enable
    icon: "mdi:speaker"
    entity_category: config
    pin: GPIO53  # BSP_POWER_AMP_IO
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    disabled_by_default: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:


