#-------------------------------------------
# LCD Back light
#-------------------------------------------
image:
  - file: "image/esphome.png"
    id: boot_logo
    resize: 200x200
    type: RGB565
    transparency: alpha_channel


# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password
  on_begin:
    then:
      - switch.turn_off: switch_antiburn
      - light.turn_off: display_backlight
      - lvgl.pause:
      - logger.log: "LVGL paused for OTA"
  on_end:
    then:
      - lvgl.resume:
      - light.turn_on: display_backlight
      - logger.log: "LVGL resumed after OTA"
      - logger.log: "OTA end, restart"
      #- switch.turn_on: restart_esp
      
logger:
  level: DEBUG
  hardware_uart: UART0
  baud_rate: 115200

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box




