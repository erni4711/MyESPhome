sd_mmc_card:
  id: sdcard
  clk_pin: 43
  cmd_pin: 44
  d0_pin: 39
  d1_pin: 40
  d2_pin: 41
  d3_pin: 42

sd_file_server:
  sd_mmc_id: sdcard
  web_server_base_id: my_web_server_base
  url_prefix: sd
  enable_download: true
  enable_upload: true
  enable_deletion: true

web_admin_local:
  web_server_base_id: my_web_server_base
  url_prefix: admin
  # Optional: populate /admin/entity_options from Home Assistant REST API.
  home_assistant_url: "http://homeassistant.local:8123"
  home_assistant_token: !secret ha_long_lived_token

