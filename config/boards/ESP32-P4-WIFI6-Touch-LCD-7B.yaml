# WaveShare ESP32-P4-WIFI6-Touch-LCD-7B
# https://www.waveshare.com/wiki/ESP32-P4-WIFI6-Touch-LCD-7B
esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  min_version: 2026.4.0
  project:
    name: "Waveshare.ESP32-P4-WIFI6-Touch-LCD-7B"
    version: "1.0.0"
  name_add_mac_suffix: false
  platformio_options:
#    platform: https://github.com/pioarduino/platform-espressif32/releases/latest/download/platform-espressif32.zip
    board_build.extra_flags: -DBOARD_HAS_PSRAM -DLV_USE_SNAPSHOT=1 -DCONFIG_SDMMC_ENABLE_POWER_CONTROL=1
  on_boot:
    - logger.log: "ESPHome booted"
    - delay: 5s
    - lvgl.widget.hide: boot_screen


# We won't need this once this board is added to ESPhome
external_components:
  - source:
      type: local
      path: components

  # source: github://pr#7639
  #   components: [camera, camera_encoder, camera_pipeline, camera_sensor, esp32_camera]
  #   refresh: 1h




esp32:
  board: esp32-p4-evboard
  framework:
    type: esp-idf
    version: recommended
    advanced:
      enable_idf_experimental_features: true
    sdkconfig_options:
      CONFIG_FATFS_LFN_NONE: "n"
      CONFIG_FATFS_LFN_HEAP: "y"
      CONFIG_FATFS_LFN_STACK: "n"
      CONFIG_FATFS_MAX_LFN: "255"
      CONFIG_VFS_SUPPORT_DIR: "y"
      CONFIG_WIFI_RMT_NVS_ENABLED: "n"
  flash_size: 32MB
  cpu_frequency: 360MHz

esp32_hosted:
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  active_high: true

update:
  - platform: esp32_hosted
    type: embedded
    id: c6_hosted_update
    name: ESP32 C6 Hosted Firmware
    path: firmware/esp32c6_hosted.bin
    sha256: 0ec2d27db910051ad11ad5e26703af1544b7ac16fee1401f763e92907dce96c1

button:
  - platform: template
    name: ESP32 C6 Hosted Flash
    icon: mdi:chip
    on_press:
      - update.perform:
          id: c6_hosted_update
          force_update: true

psram:
  mode: hex
  speed: 200MHz

preferences:
  flash_write_interval: 5min

esp_ldo:
  - voltage: 2.5V
    channel: 3

# -------------------------------------------
# Touchscreen gt911 i2c
# -------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO07
    scl: GPIO08
    frequency: 400kHz
    scan: true

tab5_camera:
  id: ov5647_camera
  name: OV5647 Camera
  i2c_id: bus_a
  external_clock_pin: 36
  frequency: 24000000
  address_sensor_ov5647: 0x36
  resolution: FHD
  pixel_format: RGB565
  framerate: 30
  flip_mirror: false

touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: main_display
    i2c_id: bus_a
    reset_pin: GPIO23
    transform:
      mirror_x: true
      mirror_y: true
      swap_xy: false
    # interrupt_pin: TP1  # INT not wired on this board
    update_interval: 50ms
    on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - switch.turn_off: switch_antiburn
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight

# -------------------------------------------
# Backlight
# -------------------------------------------
output:
  - platform: ledc
    id: gpio_backlight_pwm
    pin: GPIO32
    inverted: true
    frequency: 1000Hz

light:
  - platform: monochromatic
    output: gpio_backlight_pwm
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

# -------------------------------------------
# Display
# -------------------------------------------
display:
  - platform: mipi_dsi
    id: main_display
    model: WAVESHARE-ESP32-P4-WIFI6-TOUCH-LCD-7B
    color_order: RGB
    byte_order: little_endian
    # reset_pin:
    #   number: GPIO33
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 1024
      height: 600



# -------------------------------------------
# Audio devices
# -------------------------------------------
i2s_audio:
  - id: audio_bus
    i2s_mclk_pin: GPIO13
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO12

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40

microphone:
  - platform: i2s_audio
    id: esp32_microphone
    i2s_audio_id: audio_bus
    i2s_din_pin: GPIO11
    sample_rate: 16000
    bits_per_sample: 16bit
    adc_type: external
    # on_data:
    #   - logger.log:
    #       format: "Microphone data received: %d bytes"
    #       args: [x.size()]

speaker:
  - platform: i2s_audio
    id: esp32_speaker
    i2s_audio_id: audio_bus
    i2s_dout_pin: GPIO9
    audio_dac: es8311_dac
    dac_type: external
    channel: mono
    buffer_duration: 100ms
    bits_per_sample: 16bit
    sample_rate: 48000

  - platform: mixer
    id: mixing_speaker
    output_speaker: esp32_speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

switch:
  - platform: gpio
    pin: GPIO53  # BSP_POWER_AMP_IO
    name: "Audio Amplifier"
    id: audio_amplifier
    restore_mode: ALWAYS_OFF
  - platform: template
    id: camera_stream
    name: Camera Stream
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          id(ov5647_camera).start_streaming();
    turn_off_action:
      - lambda: |-
          id(ov5647_camera).stop_streaming();
  - platform: template
    name: Antiburn
    id: switch_antiburn
    icon: mdi:television-shimmer
    optimistic: true
    entity_category: "config"
    disabled_by_default: true
    turn_on_action:
      - logger.log: "Starting Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - lvgl.pause:
          show_snow: true
    turn_off_action:
      - logger.log: "Stopping Antiburn"
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:


media_player:
  - platform: speaker
    name: "${friendly_name} Speaker"
    id: speaker_media_player
    internal: false
    disabled_by_default: false
    codec_support_enabled: true
    # buffer_size: 2000000
    # task_stack_in_psram: true
    volume_min: 0.5
    volume_max: 0.75
    volume_increment: 0.05
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      sample_rate: 48000
      num_channels: 1
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - if:
          condition:
            - microphone.is_capturing:
          then:
            - micro_wake_word.stop
            - voice_assistant.stop
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_turn_on:
      - switch.turn_on: audio_amplifier
      - delay: 100ms
    on_turn_off:
      - media_player.stop: speaker_media_player
      - delay: 100ms
      - switch.turn_off: audio_amplifier
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_play:
      - logger.log: "Media player started playing, disabling microphone"
      - switch.turn_on: audio_amplifier
      - delay: 100ms
      - micro_wake_word.stop
      - voice_assistant.stop
    on_idle:
      - delay: 100ms
      - switch.turn_off: audio_amplifier
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_micro_wake_word




micro_wake_word:
  id: my_wake_word
  vad:
  models:
    - model: "okay_nabu"
  on_wake_word_detected:
    then:
      - logger.log: "Wake word detected"
      - switch.turn_off: switch_antiburn
      - if:
          condition: lvgl.is_paused
          then:
            - lvgl.resume:
            - lvgl.widget.redraw:
      - light.turn_on: display_backlight
      - lvgl.page.show: voice_page
      - voice_assistant.start:
          wake_word: !lambda return wake_word;

voice_assistant:
  microphone: esp32_microphone
  media_player: speaker_media_player
  micro_wake_word: my_wake_word
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  conversation_timeout: 300s
  on_start:
    - text_sensor.template.publish:
        id: voice_spoken_sentence
        state: ""
  on_end:
    # Wait a short amount of time to see if an announcement starts
    - wait_until:
        condition:
          - media_player.is_announcing:
        timeout: 0.5s
    # Announcement is finished and the I2S bus is free
    - wait_until:
        - and:
            - not:
                media_player.is_announcing:
            - not:
                media_player.is_playing:
    - script.execute: start_micro_wake_word
  on_stt_end:
    - text_sensor.template.publish:
        id: voice_spoken_sentence
        state: !lambda return x;
  on_client_connected:
    - script.execute: start_micro_wake_word
  on_client_disconnected:
    - script.execute: stop_micro_wake_word

