sd_mmc_card:
  id: sdcard
  clk_pin: 43
  cmd_pin: 44
  d0_pin: 39
  d1_pin: 40
  d2_pin: 41
  d3_pin: 42

# deep_sleep:
#   touch_wakeup: true

sd_file_server:
  sd_mmc_id: sdcard
  web_server_base_id: my_web_server_base
  enable_download: true
  enable_upload: true
  enable_deletion: true


http_request:
  verify_ssl: False
  

image:
  - file: "image/esphome.png"
    id: boot_logo
    resize: 200x200
    type: RGB565
    byte_order: little_endian
    transparency: alpha_channel


# Allow Over-The-Air updates
ota:
- platform: esphome
  password: !secret ota_password
  on_begin:
    then:
      - switch.turn_off: switch_antiburn
      - lvgl.pause:
      - logger.log: "LVGL paused for OTA"
  on_end:
    then:
      - lvgl.resume:
      - logger.log: "LVGL resumed after OTA"
      - logger.log: "OTA end, restart"
      #- switch.turn_on: restart_esp
      
# UART configuration removed to avoid pin conflicts with display.
# If you need a hardware UART for a peripheral, add it here with pins
# that are not used by the display. To view logs on Windows use:
#   esphome logs 7inch.yaml --device COM9

logger:
  level: DEBUG



number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box


api:
  on_client_connected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
  on_client_disconnected:
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.hide: lbl_hastatus
 
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      - script.execute: time_update
    on_time:
      - seconds: /1
        then:
          - script.execute: time_update
script:
  - id: time_update
    then:
      - lvgl.label.update:
          id: clock_label
          text:
            time_format: "%H:%M:%S"
  - id: start_micro_wake_word
    then:
      - if:
          condition:
            and:
              - voice_assistant.connected:
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing:
              - not:
                  media_player.is_playing:
              - not:
                  micro_wake_word.is_running:
          then:
            - logger.log: "Starting wake word detection"
            - micro_wake_word.start
  - id: stop_micro_wake_word
    then:
      - if:
          condition:
            micro_wake_word.is_running:
          then:
            - logger.log: "Stopping wake word detection"
            - micro_wake_word.stop

<<: !include ../common/7i-fonts.yaml

sensor:
  - platform: template
    name: "Voice Assistant State"
    lambda: |-
      if (id(esp32_microphone).is_running()) {
        return 1;
      } else {
        return 0;
      }
    update_interval: 2s
  # Example configuration entry I2C
  - platform: bme280_i2c
    address: 0x76
    temperature:
      id: bme_temperature
      name: "BME280 Temperature"
    pressure:
      id: bme_pressure
      name: "BME280 Pressure"
    humidity:
      id: bme_humidity
      name: "BME280 Humidity"
  - platform: wifi_signal
    name: "WiFi Signal Strength"
  - platform: adc
    id: battery_voltage
    pin: GPIO20
    attenuation: auto
    name: "Battery Voltage"
    update_interval: 60s
    filters:
    - multiply: 3.0
  #   # on_value:
  #   # - lvgl.label.update:
  #   #     id: voltage_text
  #   #     text:
  #   #       format: "%.2fV"
  #   #       args: [ 'x' ]
  - platform: template
    id: battery_percent
    unit_of_measurement: "%"
    update_interval: 20s
    lambda: |-
      float v = id(battery_voltage).state;
      if (v > 4.2) v = 4.2;
      if (v < 3.0) v = 3.0;
      return (v - 3.0) * 100.0 / (4.2 - 3.0);


web_server_base:
  id: my_web_server_base

web_server:
  id: my_web_server
  web_server_base_id: my_web_server_base
  port: 80
 
screenshot:
  id: screenshot_component
  sd_mmc_id: sdcard
  camera_id: ov5647_camera

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
    ssid:
      id: wifi_ssid
      name: "WiFi SSID"
  - platform: template
    id: voice_spoken_sentence
    internal: true
    update_interval: never
    lambda: return {""};
    on_value:
      then:
        - lvgl.label.update:
            id: voice_transcript_label
            text: !lambda |-
              if (x.empty()) {
                return std::string("Waiting for speech...");
              }
              return x;
  - platform: template
    name: "Voice Assistant Status"
    id: voice_status
    update_interval: 5s
    lambda: |-
      if (id(esp32_microphone).is_running()) {
        return {"Listening"};
      } else {
        return {"Idle"};
      }
  - platform: version
    id: esphome_version
    name: "ESPHome Version"
    hide_timestamp: True
    on_value:
      then:
        - lvgl.label.update:
            id: boot_version_label
            text: !lambda |-
              auto ver_str = (std::string("ESPHome ") + id(esphome_version).state);
              return ver_str; //.c_str();


interval:
  - interval: 5s
    then:
      - lvgl.label.update:
          id: battery_text
          text: !lambda |-
            char buf[16];
            sprintf(buf, "%.0f%%", id(battery_percent).state);
            return std::string(buf);
      - lvgl.label.update:
          id: boot_network_label
          text: !lambda |-
            std::string ssid = id(wifi_ssid).state;
            std::string ip = id(wifi_ip).state;
            if (ssid.empty() && ip.empty()) {
              return std::string("Network: disconnected");
            }
            if (ssid.empty()) ssid = "unknown";
            if (ip.empty()) ip = "no ip";
            return std::string("Network: ") + ssid + " (" + ip + ")";
      - lvgl.label.update:
          id: boot_sd_label
          text: !lambda |-
            if (!id(sdcard).is_mounted()) {
              return std::string("SD: not mounted");
            }
            uint64_t total_kb = 0;
            uint64_t free_kb = 0;
            if (!id(sdcard).get_capacity_kb(&total_kb, &free_kb)) {
              return std::string("SD: mount ok, size unknown");
            }
            const double total_gb = total_kb / (1024.0 * 1024.0);
            const double free_gb = free_kb / (1024.0 * 1024.0);
            char buf[64];
            snprintf(buf, sizeof(buf), "SD: %.1f GB free / %.1f GB", free_gb, total_gb);
            return std::string(buf);
      - lvgl.label.update:
          id: boot_bme_temp_label
          text: !lambda |-
            if (!id(bme_temperature).has_state()) {
              return std::string("Temp: --.- C");
            }
            char buf[32];
            snprintf(buf, sizeof(buf), "Temp: %.1f C", id(bme_temperature).state);
            return std::string(buf);
      - lvgl.label.update:
          id: boot_bme_hum_label
          text: !lambda |-
            if (!id(bme_humidity).has_state()) {
              return std::string("Hum: --.- %%");
            }
            char buf[32];
            snprintf(buf, sizeof(buf), "Hum: %.1f %%", id(bme_humidity).state);
            return std::string(buf);
      - lvgl.label.update:
          id: boot_bme_pres_label
          text: !lambda |-
            if (!id(bme_pressure).has_state()) {
              return std::string("Pres: ----.- hPa");
            }
            char buf[32];
            snprintf(buf, sizeof(buf), "Pres: %.1f hPa", id(bme_pressure).state);
            return std::string(buf);
  - interval: 2s
    then:
      - lambda: |-
          static bool started = false;
          if (started) {
            return;
          }
          // camera_canvas not available (camera page commented out)
          // id(camera_display).configure_canvas(id(camera_canvas));
          if (id(camera_stream).state) {
            id(ov5647_camera).start_streaming();
          }
          started = true;

# LVGL settings required for this display
lvgl:
  on_swipe_left:
    - lvgl.page.next:
        animation: NONE
        #time: 180ms
  on_swipe_right:
    - lvgl.page.previous:
        animation: NONE
        #time: 180ms
  rotation: 180
  byte_order: little_endian
  theme:
    label:
      text_font: font_norm
    button:
      text_font: font_norm
    spinbox:
      text_font: font_norm
  on_idle:
    timeout: !lambda "return (id(display_timeout).state * 1000);"
    then:
      - logger.log: "LVGL is idle"
      - light.turn_off: display_backlight
      - switch.turn_on: switch_antiburn
      - lvgl.pause:
  <<: !include ../gui/styles.yaml
  top_layer:
    widgets:
      - obj:
          styles: header_footer
          bg_opa: COVER
          align: top_left
          width: 40
          layout:
            type: flex
            flex_flow: row
            pad_column: 4
            flex_align_main: start
            flex_align_cross: start
            
          widgets:
            - button:
                id: reboot_button
                styles: style_circle_button_mini
                text: ${mdi_power}
                on_press:
                  then:
                    - lambda: |-
                        esp_restart();
      - obj:
          styles: header_footer
          align: top_right
          width: 330
          bg_opa: COVER
          layout:
            type: flex
            flex_flow: row
            pad_column: 4
            flex_align_main: end
            flex_align_cross: start
            flex_align_track: end
          widgets:
            - label:
                id: clock_label
                text:
                  time_format: "%H:%M:%S"
                text_color: 0xFFFFFF
                text_font: font_mono
            - label:
                id: lbl_battery_status
                text_font: battery_icons_20
                text_align: center
                text: "${mdi_battery_unknown}" # start with mdi-battery-unknown
            - label:
                id: battery_text 
                text: "~50%"
                text_font: font_mono
                align: TOP_RIGHT
                # x: -10 
                # y: 40
            - label:
                text_font: roboto_reg
                text: "${mdi_wifi}"
                id: lbl_hastatus
                hidden: true
                text_align: center
            - button:
                id: about_button
                styles: style_circle_button_mini
                text: ${mdi_info}
                on_press:
                  then:
                    - lvgl.widget.show: boot_about_label
                    - lvgl.widget.show: boot_screen
      - buttonmatrix:
          align: bottom_mid
          bg_opa: COVER
          styles: header_footer
          pad_all: 0
          outline_width: 0
          height: ${ui_footer_height}
          width: 100%
          id: top_layer
          items:
            styles: header_footer
          rows:
            - buttons:
              - id: page_prev
                text: "\uF053"
                on_press:
                  then:
                    - lvgl.page.previous:
              - id: page_home
                text: "\uF015"
                on_press:
                  then:
                    - lvgl.page.show: main_page
              - id: page_sleep
                text: "Z"
                on_press:
                  then:
                    - logger.log: "Deep sleep disabled"
              - id: page_next
                text: "\uF054"
                on_press:
                  then:
                    - lvgl.page.next:
      - obj:
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: 0xffffff
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          shadow_width: 0
          widgets:
            - label:
                id: boot_about_label              
                align: TOP_LEFT
                text_font: roboto_med
                text: "${mdi_info} About"
                hidden: true
            - image:
                align: CENTER
                src: boot_logo
                y: -40
            - spinner:
                align: CENTER
                y: 95
                height: 50
                width: 50
                spin_time: 1s
                arc_length: 60deg
                arc_width: 8
                indicator:
                  arc_color: 0x18bcf2
                  arc_width: 8
            - label:
                id: boot_version_label
                align: CENTER
                y: 160  
                text: "X"
            - label:
                id: boot_bme_temp_label
                align: TOP_RIGHT
                x: -10
                y: 10
                text_font: font_small
                text: "Temp: --.- C"
            - label:
                id: boot_bme_hum_label
                align: TOP_RIGHT
                x: -10
                y: 30
                text_font: font_small
                text: "Hum: --.- %"
            - label:
                id: boot_bme_pres_label
                align: TOP_RIGHT
                x: -10
                y: 50
                text_font: font_small
                text: "Pres: ----.- hPa"
            - label:
                id: boot_network_label
                align: CENTER
                y: 195
                text_font: font_small
                text: "Network: connecting"
            - label:
                id: boot_sd_label
                align: CENTER
                y: 220
                text_font: font_small
                text: "SD: checking"
            - label:
                border_width: 4
                border_color: white
                align: BOTTOM_RIGHT
                text_font: font_small
                text: "based on a template by Bernd Oerding\nhttps://github.com/erni4711/MyESPhome.git"
            - label:
                align: CENTER
                y: 250  
                text: "Touch to close"
            
          on_press:
            - lvgl.widget.hide: boot_screen
