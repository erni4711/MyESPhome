height: SIZE_CONTENT
width: ${ui_weather_hourly_column_width}
bg_color: gray50
pad_top: 0
pad_bottom : 0
pad_left: 0
pad_right: 0
border_width: 1
shadow_width: 0
outline_width: 0
border_color: light_blue
border_post: true
radius: 0
layout:
  type: flex
  flex_flow: COLUMN
  flex_align_cross: STRETCH
  flex_align_track: START
  pad_column: 0
  pad_row: 1
grid_cell_row_pos: ${row}
grid_cell_column_pos: ${col}
widgets:
  - label:
      id: forecast_hourly_time_label_${id}
      height: SIZE_CONTENT
      width: 100%
      text_font: font_small
      text: " "
      bg_color: light_blue
      bg_opa: COVER
      text_align: CENTER
  - label:
      id: forecast_hourly_condition_icon_label_${id}
      text_font: font_small
      text: ${mdi_unknown}
      hidden: true
      height: SIZE_CONTENT
      text_color: dodgerblue
  - label:
      id: forecast_hourly_temperature_label_${id}
      height: SIZE_CONTENT
      text_font: font_small
      text: ""
  - label:
      id: forecast_hourly_pop_label_${id}
      height: SIZE_CONTENT
      text_font: font_small
      hidden: true
      text: ""
  - label:
      id: forecast_hourly_wind_label_${id}
      height: SIZE_CONTENT
      text_font: font_small
      text_color: gray
      text: "${mdi_windy} "
  - label:
      id: forecast_hourly_rain_label_${id}
      height: SIZE_CONTENT
      text_font: font_small
      text_color: gray
      text: "${mdi_rainy} "
  - label:
      id: forecast_hourly_snow_label_${id}
      height: SIZE_CONTENT
      text_font: font_small
      text_color: gray
      text: "${mdi_snowy} "
