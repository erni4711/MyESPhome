lvgl:
  pages:
    - id: voice_page
      on_load:
        - lambda: |-
            id(lvgl_page_select).publish_state("Voice Control");
        - lvgl.label.update:
            id: voice_transcript_label
            text: !lambda |-
              if (id(voice_spoken_sentence).state.empty()) {
                return std::string("Waiting for speech...");
              }
              return id(voice_spoken_sentence).state;
      widgets:
        - obj:
            id: voice_header
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: "Voice Control"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF
        - obj:
            id: voice_body
            align: top_left
            y: ${ui_header_height}
            width: ${ui_page_width}
            height: ${ui_page_height}
            border_width: 0
            shadow_width: 0
            outline_width: 0
            pad_all: 12
            scrollbar_mode: "OFF"
            layout:
              type: grid
              grid_rows: [75%, 25%]
              grid_columns: [25%, 25%, 25%, 25%]
              pad_row: 12
              pad_column: 12
            widgets:
              - obj:
                  width: 100%
                  height: 75%
                  grid_cell_row_pos: 0
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 4
                  border_width: 0
                  shadow_width: 0
                  outline_width: 0
                  radius: 12
                  pad_all: 18
                  bg_color: ${color_darker_grey}
                  text_color: ${color_white}
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    pad_row: 8
                  widgets:
                    - label:
                        text: "Assistant"
                        text_font: roboto_med
                        text_color: ${color_light_grey}
                    - label:
                        id: voice_status_label
                        text: "Idle"
                        text_font: voice_status_font
                        text_color: ${color_white}
                    - label:
                        id: wake_word_status_label
                        text: "Wake word: standby"
                        text_font: font_norm
                        text_color: ${color_light_grey}
                    - label:
                        text: "Use Listen for push-to-talk, or arm wake-word detection for hands-free activation."
                        text_font: font_small
                        text_color: ${color_grey}
                    - label:
                        text: "Spoken sentence"
                        text_font: roboto_med
                        text_color: ${color_light_grey}
                    - label:
                        id: voice_transcript_label
                        width: 100%
                        long_mode: WRAP
                        text: "Waiting for speech..."
                        text_font: font_norm
                        text_color: ${color_white}
              - button:
                  id: voice_listen_button
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: style_circle_button
                  bg_color: 0x51a0e4
                  on_press:
                    - if:
                        condition:
                          not:
                            voice_assistant.is_running:
                        then:
                          - script.execute: stop_micro_wake_word
                          - voice_assistant.start
                  widgets:
                    - label:
                        styles: style_circle_label
                        text: "Listen"
                        text_color: ${color_white}
              - button:
                  id: voice_stop_button
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 1
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: style_circle_button
                  bg_color: 0xd9534f
                  on_press:
                    - if:
                        condition:
                          voice_assistant.is_running:
                        then:
                          - voice_assistant.stop
                    - script.execute: start_micro_wake_word
                  widgets:
                    - label:
                        styles: style_circle_label
                        text: "Stop"
                        text_color: ${color_white}
              - button:
                  id: wake_word_on_button
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 2
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: style_circle_button
                  bg_color: 0x5ca848
                  on_press:
                    - script.execute: start_micro_wake_word
                  widgets:
                    - label:
                        styles: style_circle_label
                        text: "Wake On"
                        text_color: ${color_white}
              - button:
                  id: wake_word_off_button
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 3
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  styles: style_circle_button
                  bg_color: 0xf07c40
                  on_press:
                    - script.execute: stop_micro_wake_word
                  widgets:
                    - label:
                        styles: style_circle_label
                        text: "Wake Off"
                        text_color: ${color_white}

interval:
  - interval: 2s
    then:
      - lvgl.label.update:
          id: voice_status_label
          text: !lambda |-
            if (id(my_wake_word).is_running()) {
              return std::string("Wake Word Ready");
            }
            if (id(esp32_microphone).is_running()) {
              return std::string("Listening");
            }
            return std::string("Idle");
      - lvgl.label.update:
          id: wake_word_status_label
          text: !lambda |-
            if (id(my_wake_word).is_running()) {
              return std::string("Wake word: armed");
            }
            return std::string("Wake word: off");