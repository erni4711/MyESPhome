text_sensor:
  - platform: homeassistant
    entity_id: sensor.forecast_0_icon
    id: condition_0_icon

  - platform: homeassistant
    entity_id: sensor.forecast_1_icon
    id: condition_1_icon

  - platform: homeassistant
    entity_id: sensor.forecast_2_icon
