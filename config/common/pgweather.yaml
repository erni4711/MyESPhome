  # Per-day Home Assistant compact JSON sensors: owm_daily_0 .. owm_daily_7
  # Each sensor contains a compact JSON object for a single day. Parse and publish
  # the parts into internal text_sensors to drive the LVGL UI.
  - platform: homeassistant
    entity_id: sensor.owm_daily_0
    id: owm_daily_0
    on_value:
      then:
        - lambda: |-
            #include <ArduinoJson.h>
            const char *j = x.c_str();
            ESP_LOGD("pgweather","owm_daily_0 state: %s", j ? j : "(null)");
            ESP_LOGI("pgweather","owm_daily_0 raw from HA: %s", j ? j : "(null)");
            if (!j || !*j) { ESP_LOGD("pgweather","owm_daily_0 empty"); return; }
            StaticJsonDocument<1024> doc;
            DeserializationError err = deserializeJson(doc, j);
            if (err) { ESP_LOGW("pgweather","owm_daily_0 deserializeJson failed: %s", err.c_str()); return; }
            JsonObject it = doc.as<JsonObject>();

            auto fmt_day = [](long dt, char *out, size_t len) {
              if (!dt) { out[0]=0; return; }
              time_t t = (time_t)dt;
              struct tm *lt = localtime(&t);
              if (lt) strftime(out, len, "%a", lt);
              else out[0]=0;
            };

            long dt = it["dt"] | 0L;
            char daybuf[16]; fmt_day(dt, daybuf, sizeof(daybuf));

            float hi = 0.0f, lo = 0.0f;
            if (it["temp"].is<JsonObject>()) {
              JsonObject t = it["temp"].as<JsonObject>();
              hi = t["max"] | t["day"] | 0.0f;
              lo = t["min"] | 0.0f;
            } else {
              hi = it["temp"] | 0.0f;
              lo = it["temp"] | 0.0f;
            }
            char hibuf[16]; snprintf(hibuf, sizeof(hibuf), "%d°", (int)round(hi));
            char lobuf[16]; snprintf(lobuf, sizeof(lobuf), "%d°", (int)round(lo));

            const char *desc = "";
            const char *glyph = "${mdi_unknown}";
            if (it["weather"].is<JsonArray>() && it["weather"].size() > 0) {
              JsonObject w = it["weather"][0].as<JsonObject>();
              desc = w["description"] | "";
              const char *icon = w["icon"] | "";
              if (strcmp(icon, "01d") == 0) glyph = "${mdi_sunny}";
              else if (strcmp(icon, "01n") == 0) glyph = "${mdi_clear_night}";
              else if (strcmp(icon, "02d") == 0 || strcmp(icon, "02n") == 0) glyph = "${mdi_partlycloudy}";
              else if (strcmp(icon, "03d") == 0 || strcmp(icon, "03n") == 0 || strcmp(icon, "04d") == 0 || strcmp(icon, "04n") == 0) glyph = "${mdi_cloudy}";
              else if (strcmp(icon, "09d") == 0 || strcmp(icon, "09n") == 0) glyph = "${mdi_pouring}";
              else if (strcmp(icon, "10d") == 0 || strcmp(icon, "10n") == 0) glyph = "${mdi_rainy}";
              else if (strcmp(icon, "11d") == 0 || strcmp(icon, "11n") == 0) glyph = "${mdi_lightning_rainy}";
              else if (strcmp(icon, "13d") == 0 || strcmp(icon, "13n") == 0) glyph = "${mdi_snowy}";
              else if (strcmp(icon, "50d") == 0 || strcmp(icon, "50n") == 0) glyph = "${mdi_fog}";
            }

            ESP_LOGD("pgweather","owm_daily_0 publishing: day='%s' hi='%s' lo='%s' desc='%s' glyph='%s'", daybuf, hibuf, lobuf, desc, glyph);
            if (!daybuf[0]) ESP_LOGW("pgweather","owm_daily_0: day is empty");
            if (!hibuf[0]) ESP_LOGW("pgweather","owm_daily_0: hi temp is empty");
            if (!lobuf[0]) ESP_LOGW("pgweather","owm_daily_0: lo temp is empty");
            if (!desc || !*desc) ESP_LOGW("pgweather","owm_daily_0: description is empty");
            if (!glyph || !*glyph) ESP_LOGW("pgweather","owm_daily_0: glyph is empty");
            id(forecast_daily_day_0).publish_state(std::string(daybuf));
            id(forecast_daily_temperature_hi_0).publish_state(std::string(hibuf));
            id(forecast_daily_temperature_lo_0).publish_state(std::string(lobuf));
            id(forecast_daily_description_0).publish_state(std::string(desc));
            id(forecast_daily_condition_icon_0).publish_state(std::string(glyph));

