lvgl:
# Main Page
  pages:
      - id: weather_page
        width: 100%
        bg_color: White
        widgets:
          - obj:
                align: TOP_MID
                styles: header_footer
                widgets:
                    - label:
                        text: "Wettervorhersage"
                        align: CENTER
                        text_align: CENTER
                        text_color: 0xFFFFFF
          - obj:
              align: top_left
              y: 30
              width: 100%
              height: 240
              border_width: 0
              outline_width: 0
              pad_all: 0
              layout:
                type: GRID
                grid_rows: [ 240 ]
                grid_columns: [ fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1) ]
                pad_column: 0
                pad_row: 0
              widgets:
                  - obj:
                      <<: *forecast_obj_base
                      grid_cell_row_pos: 0
                      grid_cell_column_pos: 0
                      widgets:
                          - label:
                              id: forecast_day_0
                              <<: *forecast_label_base
                              text: ??? 
                              align: CENTER
                          - label:
                              id: forecast_condition_icon_0
                              <<: *forecast_label_base
                              text_font: weather_symbols_80
                              text: ${mdi_unknown}
                          - label:
                              id: forecast_description_0
                              <<: *forecast_label_base_lo
                              text: ""
                              align: CENTER
                              width: 100
                              height: 40
                          - label:
                              id: forecast_temperature_hi_0
                              <<: *forecast_label_base
                              text: "---°"
                          - label:
                              id: forecast_temperature_lo_0
                              <<: *forecast_label_base_lo
                              text: "---°"

