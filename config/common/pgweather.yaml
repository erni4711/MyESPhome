text_sensor:
  # Internal forecast parts (filled by `sensor.owm_daily_text` parser)
  - platform: template
    id: forecast_daily_condition_icon_0
    internal: true
    update_interval: never
    name: "forecast_condition_icon_0"
    lambda: |-
      return std::string("");
    on_value:
      then:
        - lvgl.label.update:
            id: forecast_condition_icon_0
            text:
              format: "%s"
              args: [ 'id(forecast_daily_condition_icon_0).state.c_str()' ]
