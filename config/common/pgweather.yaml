# Styles for Weather forecast
.forecast_styles:
    - &forecast_obj_base
      height: 240
      width: SIZE_CONTENT
      bg_color: gray50
      radius: 3
      pad_top: 2
      pad_bottom : 2
      layout:
        type: flex
        flex_flow: COLUMN
        flex_align_cross: center
        flex_align_track: center
        pad_column: 0
        pad_row: 2

    - &forecast_label_base
    #   text_font: nunito_24
      height: SIZE_CONTENT

    - &forecast_label_base_lo
      height: SIZE_CONTENT
      text_font: font_small
      text_color: dodgerblue

    - &forecast_image_base
      height: SIZE_CONTENT

