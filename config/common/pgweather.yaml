lvgl:
# Main Page
  pages:
      - id: weather_page_dailyy
        width: 100%
        bg_color: White
        widgets:
          - obj:
                align: TOP_MID
                styles: header_footer
                widgets:
                    - label:
                        text: "Wettervorhersage 8 Tage"
                        align: CENTER
                        text_align: CENTER
                        text_color: 0xFFFFFF
          - obj:
              align: top_left
              y: 30
              width: 100%
              height: 240
              border_width: 0
              outline_width: 0
              pad_all: 0
              layout:
                type: GRID
                grid_rows: [ 240 ]
                grid_columns: [ fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1), fr(1) ]
                pad_column: 0
                pad_row: 0
              widgets:
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 0, id: 0 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 1, id: 1 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 2, id: 2 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 3, id: 3 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 4, id: 4 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 5, id: 5 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 6, id: 6 } }              
                  - obj:
                     <<: !include { file: assets/daily_widget.yaml, vars: { row: 0, col: 7, id: 7 } }              

# hourly weather page
      - id: weather_page_hourly
        width: 100%
        bg_color: White
        widgets:
          - obj:
                align: TOP_MID
                styles: header_footer
                widgets:
                    - label:
                        text: "Wettervorhersage 48 Stunden"
