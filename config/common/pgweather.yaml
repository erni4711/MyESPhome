text_sensor:

  # Per-day Home Assistant compact JSON sensors: owm_daily_0 .. owm_daily_7
  # Each sensor contains a compact JSON object for a single day. Parse and publish
  # the parts into internal text_sensors to drive the LVGL UI.
  - platform: homeassistant
    entity_id: sensor.owm_daily_0
    id: owm_daily_0
    on_value:
      then:
        - lambda: |-
            pgweather_daily_parse_state(x, id(forecast_day_0));
  - platform: homeassistant
    entity_id: sensor.owm_daily_0
    attribute: data
    id: owm_daily_0_json
    on_value:
      then:
        - lambda: |-
            pgweather_daily_parse_attrs(x, id(forecast_day_0), id(forecast_description_0), id(forecast_condition_icon_0), id(forecast_temperature_hi_0), id(forecast_temperature_lo_0));
