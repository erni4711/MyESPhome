  - platform: homeassistant
    entity_id: sensor.owm_hourly_0
    id: owm_hourly_0
    on_value:
      then:
        - lambda: |-
            if (x.size() == 0) return;
            StaticJsonDocument<512> doc;
            auto err = deserializeJson(doc, x.c_str());
            if (err) { ESP_LOGW("pgweather", "owm_hourly_0 parse failed: %s", err.c_str()); return; }
            if (doc.containsKey("dt_txt") && doc["dt_txt"].is<const char*>()) {
              id(forecast_hourly_time_0).publish_state(std::string((const char*)doc["dt_txt"]));
            } else if (doc.containsKey("dt")) {
              auto fmt_hour = [](long dt, char *out, size_t len) {
                if (!dt) { out[0]=0; return; }
                time_t t = (time_t)dt;
                struct tm *lt = localtime(&t);
                if (lt) strftime(out, len, "%H:%M", lt);
                else out[0]=0;
              };

              long dt = doc["dt"].as<long>();
              char tsbuf[16]; fmt_hour(dt, tsbuf, sizeof(tsbuf));
              id(forecast_hourly_time_0).publish_state(std::string(tsbuf));
            }
            std::string icon_code = "";
            if (doc.containsKey("weather") && doc["weather"].is<JsonArray>() && doc["weather"][0].containsKey("icon") && doc["weather"][0]["icon"].is<const char*>()) {
              icon_code = std::string((const char*)doc["weather"][0]["icon"]);
            } else if (doc.containsKey("icon") && doc["icon"].is<const char*>()) {
              icon_code = std::string((const char*)doc["icon"]);
            }
            std::string glyph = std::string("${mdi_unknown}");
            if (icon_code == "01d") glyph = std::string("${mdi_sunny}");
            else if (icon_code == "01n") glyph = std::string("${mdi_clear_night}");
            else if (icon_code == "02d" || icon_code == "02n") glyph = std::string("${mdi_partlycloudy}");
            else if (icon_code == "03d" || icon_code == "03n" || icon_code == "04d" || icon_code == "04n") glyph = std::string("${mdi_cloudy}");
            else if (icon_code == "09d" || icon_code == "09n") glyph = std::string("${mdi_pouring}");
            else if (icon_code == "10d" || icon_code == "10n") glyph = std::string("${mdi_rainy}");
            else if (icon_code == "11d" || icon_code == "11n") glyph = std::string("${mdi_lightning_rainy}");
            else if (icon_code == "13d" || icon_code == "13n") glyph = std::string("${mdi_snowy}");
            else if (icon_code == "50d" || icon_code == "50n") glyph = std::string("${mdi_fog}");
            id(forecast_hourly_condition_icon_0).publish_state(glyph);
            if (doc.containsKey("temp")) {
              double t = doc["temp"].as<double>();
              char tb[18];
              snprintf(tb, sizeof(tb), "%.1f°", t);
              id(forecast_hourly_temperature_0).publish_state(std::string(tb));
            }
            if (doc.containsKey("pop")) {
              double p = doc["pop"].as<double>();
              int pi = (int)(p * 100.0 + 0.5);
              char pb[8];
              snprintf(pb, sizeof(pb), "%d%%", pi);
              id(forecast_hourly_pop_0).publish_state(std::string(pb));
            }
