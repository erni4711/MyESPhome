            return std::string(buf);

interval:
  - interval: 1h
    then:
      - script.execute: capture_history_sample
      - script.execute: refresh_history_page
  # Fetch HA history on startup (after 30 seconds)
  - interval: 30s
    startup_delay: 30s
    then:
      - logger.log:
          format: "Initializing history from Home Assistant..."
          tag: history
          level: INFO
      - script.execute: fetch_ha_history
      - script.execute: refresh_history_page

