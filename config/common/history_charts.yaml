# History Charts Component - Enhanced with Home Assistant Integration
# Displays 24-hour temperature and humidity history with line charts
# Fetches historical data from Home Assistant's statistics database
#
# SETUP INSTRUCTIONS:
# 1. Find your sensor entity IDs in Home Assistant:
#    - Go to Developer Tools > States
#    - Search for your temperature and humidity sensors
#    - Update options in history_temp_source and history_humidity_source below
#
# 2. (Optional) Create a Long-Lived Access Token for authentication:
#    - In Home Assistant: Settings > Devices & Services > Developer Tools
#    - Create Long-Lived Access Token (bottom of page)
#    - Add to config/secrets.yaml: ha_long_lived_token: "your_token_here"
#    - Set ha_token below to !secret ha_long_lived_token
#
# 3. Customize Home Assistant URL if not at homeassistant.local:8123
#
# DATA FLOW:
# - At startup (30s delay): Fetches 24h history from HA and populates buffers
# - Every hour: Captures latest sensor reading and shifts buffer
# - Both local and HA data sources: HA for historical depth, local for real-time
#
# Requires: bme_temperature and bme_humidity sensors to be defined

# Configuration (customize these)
substitutions:
  ha_url: "http://homeassistant.local:8123"
  ha_temp_entity_default: "sensor.esp32p4_7b_sample_bme280_temperature"
  ha_humidity_entity_default: "sensor.esp32p4_7b_sample_bme280_humidity"
  ha_token: ""  # Set to !secret ha_long_lived_token in your device config

http_request:
  useragent: esphome/history-charts
  timeout: 10s

globals:
  - id: temp_history_24h
    type: float[24]
    restore_value: no
    initial_value: '{0.0f}'
  - id: humidity_history_24h
    type: float[24]
    restore_value: no
    initial_value: '{0.0f}'

select:
  - platform: template
    id: history_temp_source
    name: History Temperature Source
    optimistic: true
    restore_value: true
    options:
      - ${ha_temp_entity_default}
      - sensor.office_temperature
      - sensor.living_room_temperature
      - sensor.outside_temperatur_2
    initial_option: ${ha_temp_entity_default}
    set_action:
      - script.execute: fetch_ha_history

  - platform: template
    id: history_humidity_source
    name: History Humidity Source
    optimistic: true
    restore_value: true
    options:
      - ${ha_humidity_entity_default}
      - sensor.office_humidity
      - sensor.living_room_humidity
    initial_option: ${ha_humidity_entity_default}
    set_action:
      - script.execute: fetch_ha_history

script:
  - id: fetch_ha_history
    then:
      - logger.log:
          format: "Fetching history from Home Assistant..."
          tag: history
          level: INFO
      - if:
          condition:
            lambda: 'return std::string("${ha_token}").empty();'
          then:
            - logger.log:
                format: "Skipping HA history fetch: ha_token is empty"
                tag: history
                level: WARN
            - script.execute: capture_history_sample
          else:
            - http_request.get:
                url: !lambda |-
                  auto temp_option = id(history_temp_source).current_option();
                  auto humidity_option = id(history_humidity_source).current_option();

                  std::string temp_entity = temp_option.empty() ? std::string("${ha_temp_entity_default}") : temp_option.str();
                  std::string humidity_entity = humidity_option.empty() ? std::string("${ha_humidity_entity_default}") : humidity_option.str();

                  ESP_LOGI("history", "Using entities temp=%s humidity=%s", temp_entity.c_str(), humidity_entity.c_str());
                  // Leave period start unspecified so Home Assistant returns the default last 24h window.
                  return std::string("${ha_url}/api/history/period?filter_entity_id=") + temp_entity + "," + humidity_entity + "&minimal_response";
                request_headers:
                  Authorization: !lambda |-
                    return "Bearer ${ha_token}";
                on_response:
                  - logger.log:
                      format: "History fetch complete"
                      tag: history
                      level: DEBUG
                  - script.execute: capture_history_sample

  - id: capture_history_sample
    then:
      - lambda: |-
          static bool initialized = false;
          const bool has_temp = id(bme_temperature).has_state();
          const bool has_humidity = id(bme_humidity).has_state();

          float temp = has_temp ? id(bme_temperature).state : 0.0f;
          float hum = has_humidity ? id(bme_humidity).state : 0.0f;

          if (!initialized) {
            for (int i = 0; i < 24; i++) {
              id(temp_history_24h)[i] = temp;
              id(humidity_history_24h)[i] = hum;
            }
            initialized = true;
            return;
          }

          for (int i = 0; i < 23; i++) {
            id(temp_history_24h)[i] = id(temp_history_24h)[i + 1];
            id(humidity_history_24h)[i] = id(humidity_history_24h)[i + 1];
          }

          id(temp_history_24h)[23] = temp;
          id(humidity_history_24h)[23] = hum;

  - id: refresh_history_page
    then:
      - lvgl.line.update:
          id: temperature_history_line
          points:
            - x: 0
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[0] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 20
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[1] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 40
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[2] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 60
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[3] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 80
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[4] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 100
              y: !lambda |-
                int y = 120 - (int) ((id(temp_history_24h)[5] - 10.0f) * 4.8f);
                if (y < 0) y = 0;
                if (y > 120) y = 120;
                return y;
            - x: 120
              y: !lambda |-
