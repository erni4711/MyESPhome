# HVAC Modes UI scripts
- id: set_hvac_mode
  parameters:
    mode: string
  then:
    # Reset other buttons to inactive color
    - lvgl.label.update:
        id: heat_button_label
        text_color: ${color_grey}
    # Mode Label update
    - if:
        condition:
          lambda: 'return (mode == "off" || mode == "unavailable" || mode == "unknown");'
        then:
          - lvgl.label.update:
              id: mode_label
              text: !lambda |-
                if (!id(ui_language).has_state()) return "OFF";
                auto lang = id(ui_language).state;
                bool de = !lang.empty() && (lang.rfind("de", 0) == 0 || lang == "Deutsch" || lang == "DE");
                if (mode == "off") return de ? "AUS" : "OFF";
                return de ? "OFFLINE" : "OFFLINE";
          - lvgl.label.update:
              id: power_button_label
              text_color: ${color_red}
          - lvgl.widget.hide: temp_inc_button
          - lvgl.widget.hide: temp_dec_button
          - lvgl.widget.hide: meter_ticks
          - lvgl.widget.hide: hvac_temp_knob
        else:
          - lvgl.label.update:
              id: power_button_label
              text_color: ${color_success}
          - lvgl.widget.show: temp_inc_button
          - lvgl.widget.show: temp_dec_button
          - lvgl.widget.show: meter_ticks
          - lvgl.widget.show: hvac_temp_knob
    - if:
        condition:
          lambda: 'return mode == "heat";'
        then:
          - lvgl.label.update:
              id: mode_label
              text: !lambda |-
                if (!id(ui_language).has_state()) return "HEAT";
                auto lang = id(ui_language).state;
                bool de = !lang.empty() && (lang.rfind("de", 0) == 0 || lang == "Deutsch" || lang == "DE");
                return de ? "HEIZEN" : "HEAT";
          - lvgl.label.update:
              id: heat_button_label
              text_color: ${color_heat}
# Set HVAC Temperature UI scripts
- id: set_hvac_temp
  parameters:
    direction: string
  then:
    - homeassistant.action:
        action: climate.set_temperature
        data:
          entity_id: ${climate_entity}
          temperature: !lambda |-
            float current_temp = id(set_temperature).state;
            if (direction == "up") {
              return current_temp + 0.5;
            } else {
              return current_temp - 0.5;
            }
